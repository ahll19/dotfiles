[window]
# decorations = "None"
opacity = 0.9

[font]
normal = {family = "JetBrainsMono Nerd Font Mono", style = "Regular"}
bold = {family = "FiraMono Nerd Font", style = "Bold"}

[bell]
animation = "EaseOut"

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Beam", blinking = "Off" }
thickness = 0.3

[mouse]
hide_when_typing = true

